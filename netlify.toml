[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Netlify Dev vuelve a resolver build.publish al preparar su proxy.
[context.dev]
  publish = "public"

[dev]
  command = "npm run dev:web"
  framework = "#custom"
  targetPort = 5173
  port = 8888
  publish = "public"
  autoLaunch = false

# La CSP estricta se genera exclusivamente en dist/_headers al hacer build.
# Los headers de este TOML son globales, incluso dentro de context.dev.

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
